<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MentorHub – klikalny mockup</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="nav"></div>
<main id="app" tabindex="-1"></main>
<div id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="devbar">
  <strong>Demo</strong>
  <label>Rola
    <select id="dev-role">
      <option value="guest">Gość</option><option value="mentee">Uczeń</option>
      <option value="mentor">Mentor</option><option value="admin">Admin</option>
    </select>
  </label>
  <label>Stan ekranu
    <select id="dev-view">
      <option value="ok">Dane (success)</option><option value="loading">Loading</option>
      <option value="empty">Empty</option><option value="error">Error</option>
    </select>
  </label>
  <label>Ekran
    <select id="dev-screen"></select>
  </label>
</div>
<script src="dist/app.js"></script>
</body>
</html>
