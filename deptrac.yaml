# Granice architektury (spec: 2026-10-25-devmentor-tech-stack-and-engineering-standards §3.2).
# Reguły:
#  - Domain zależy tylko od Shared i PHP.
#  - Application zależy od Domain (własnego modułu) i Shared.
#  - Infrastructure i UI zależą od Application/Domain własnego modułu i Shared.
#  - Moduły nie zależą od siebie nawzajem: komunikacja przez zdarzenia lub publiczne interfejsy w Shared.
deptrac:
  paths:
    - ./src
  layers:
    - name: IdentityDomain
      collectors:
        - type: directory
          value: src/Identity/Domain/.*
    - name: IdentityApplication
      collectors:
        - type: directory
          value: src/Identity/Application/.*
    - name: IdentityInfrastructure
      collectors:
        - type: directory
          value: src/Identity/Infrastructure/.*
