
services:
###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

  # Connection pool in front of PostgreSQL (transaction mode). NOT VERIFIED in the authoring sandbox (no Docker).
  # The app connects to pgbouncer:6432; migrations, LISTEN/NOTIFY and long jobs connect directly to `database`.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      DB_NAME: ${POSTGRES_DB:-app}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      MAX_PREPARED_STATEMENTS: 200
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379"

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
