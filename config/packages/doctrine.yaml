doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        server_version: '18'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Domain'
                prefix: 'App\Identity\Domain'
                alias: Identity
            Mentoring:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Mentoring/Domain'
                prefix: 'App\Mentoring\Domain'
                alias: Mentoring
            Catalog:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Domain'
                prefix: 'App\Catalog\Domain'
                alias: Catalog
            Scheduling:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Scheduling/Domain'
                prefix: 'App\Scheduling\Domain'
                alias: Scheduling
            Booking:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Booking/Domain'
                prefix: 'App\Booking\Domain'
                alias: Booking
            Payments:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Payments/Domain'
                prefix: 'App\Payments\Domain'
                alias: Payments
            Sessions:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Sessions/Domain'
                prefix: 'App\Sessions\Domain'
                alias: Sessions
            Messaging:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Messaging/Domain'
                prefix: 'App\Messaging\Domain'
                alias: Messaging
            Reviews:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Reviews/Domain'
                prefix: 'App\Reviews\Domain'
                alias: Reviews
            Notifications:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Notifications/Domain'
                prefix: 'App\Notifications\Domain'
                alias: Notifications
            Moderation:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Moderation/Domain'
                prefix: 'App\Moderation\Domain'
                alias: Moderation
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
